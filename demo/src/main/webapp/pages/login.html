<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图书管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "微软雅黑";
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #5a67d8; }
        .error { color: red; margin-top: 10px; }
        .tip { margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>图书管理系统</h2>
    <input type="text" id="username" placeholder="用户名" value="zhangsan">
    <input type="password" id="password" placeholder="密码" value="123456">
    <button onclick="login()">登录</button>
    <div id="errorMsg" class="error"></div>
    <div class="tip">管理员：admin / 123456 &nbsp;|&nbsp; 普通用户：zhangsan / 123456</div>
</div>
<script>
    var ctx = window.location.pathname.substring(0, window.location.pathname.indexOf('/', 1));
    if (ctx === '/pages') ctx = '';

    function login() {
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        var errorMsg = document.getElementById('errorMsg');

        var formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        var url = '/toLogin';
        console.log("请求地址：" + url);

        fetch(ctx + '/toLogin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    window.location.href = ctx + '/pages/index.html';
                } else {
                    errorMsg.innerText = data.message;
                }
            })
            .catch(() => {
                errorMsg.innerText = '请求失败';
            });
    }
</script>
</body>
</html>
